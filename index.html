<!DOCTYPE html>
<html lang="en">
<head>

<title>Feeding Lex</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap">
<style>
:root{--bg:#241208;--panel:#fff6e3;--panel-dark:#3a2111;--line:#1c0f06;--ink:#2b1608;--text:#2b1608;--dim:#7a5330;--mustard:#f0a500;--ketchup:#c62828;--grease:#6b4226;--mint:#3f8f5f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:
 repeating-linear-gradient(45deg,#2c1708,#2c1708 14px,#241208 14px,#241208 28px);
 color:var(--text);font-family:"Press Start 2P","Courier New",monospace;font-size:10px;line-height:1.6;min-height:100vh}
header{padding:20px 16px 4px;max-width:1100px;margin:0 auto}
.sign{display:inline-block;background:var(--ketchup);border:5px solid var(--ink);padding:10px 18px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-1deg)}
h1{font-size:19px;margin:0;color:var(--mustard);text-shadow:3px 3px 0 var(--ink);letter-spacing:1px}
header p{display:block;width:max-content;max-width:100%;margin:8px 0 0 8px;color:var(--mustard);font-size:9px;background:var(--ink);padding:4px 8px;transform:rotate(-1deg)}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr) minmax(0,1fr);gap:18px;padding:18px;max-width:1100px;margin:0 auto}
.leftcol{display:flex;flex-direction:column;gap:18px;min-width:0}.leftcol .pcwrap{margin:6px auto 0}
@media(max-width:860px){main{grid-template-columns:1fr}.leftcol{display:contents}.leftcol .pcwrap{order:9;margin:16px auto 40px}}
.panel{background:var(--panel);border:5px solid var(--ink);padding:14px;box-shadow:7px 7px 0 rgba(0,0,0,.45);position:relative}
.panel::before{content:"";position:absolute;inset:5px;border:2px dashed rgba(107,66,38,.35);pointer-events:none}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer;background:#000;border:5px solid var(--ink);box-shadow:7px 7px 0 rgba(0,0,0,.45)}
canvas:focus-visible,button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.stat{margin-bottom:14px;border-bottom:2px dotted var(--grease);padding-bottom:10px}
.stat:last-of-type{border-bottom:none}
.stat span{color:var(--grease);display:block}
.stat b{display:block;color:var(--ketchup);font-size:15px;margin-top:5px;word-break:break-all}
.bar{height:12px;background:#e6d7b8;border:2px solid var(--ink);margin-top:6px}
.bar i{display:block;height:100%;background:var(--mint);width:0}
h2{font-size:11px;margin:0 0 12px;color:var(--ketchup);background:var(--mustard);display:inline-block;padding:4px 8px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.up{display:block;width:100%;text-align:left;font:inherit;color:var(--text);background:#fffaf0;border:3px solid var(--ink);padding:9px;margin-bottom:10px;cursor:pointer;box-shadow:4px 4px 0 var(--grease)}
.up:hover:not(:disabled){border-color:var(--ketchup);transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--grease)}
.up:disabled{opacity:.45;cursor:not-allowed}
.up.can{border-color:var(--mint);box-shadow:4px 4px 0 var(--mint)}
.up small{display:block;color:var(--dim);margin-top:5px;font-size:8px}
.up em{font-style:normal;color:var(--ketchup)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{font:inherit;font-size:8px;color:var(--text);background:#fffaf0;border:3px solid var(--ink);padding:9px;cursor:pointer;box-shadow:4px 4px 0 var(--grease)}
.btn:hover{border-color:var(--ketchup);transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--grease)}
.logo{margin:0;display:inline-block;position:relative;isolation:isolate;transform:rotate(-2deg);padding:4px 6px 20px;text-shadow:none;font-size:inherit;color:inherit;}
.logo span{display:block;text-shadow:none}
.logo .l1{display:inline-block;text-transform:uppercase;font:400 clamp(14px,3.6vw,20px)/1 "Bungee","Impact",sans-serif;letter-spacing:5px;color:#fff2cf;background:var(--ketchup);border:4px solid var(--ink);padding:8px 14px 5px;box-shadow:4px 4px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.25);transform:rotate(1.5deg);margin-left:6px}
.logo .l2{position:relative;font:400 clamp(60px,17vw,104px)/.95 "Bungee","Impact",sans-serif;letter-spacing:3px;margin-top:-2px;background:linear-gradient(180deg,#fffbd0 0%,#ffd23f 38%,#ff9a1f 58%,#d62828 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:2px #1c0f06}
.logo .l2::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;-webkit-text-fill-color:#1c0f06;color:#1c0f06;-webkit-text-stroke:12px #1c0f06;text-shadow:2px 2px 0 #7a1010,4px 4px 0 #7a1010,6px 6px 0 #5a0c0c,8px 8px 0 #5a0c0c,10px 10px 0 #1c0f06,12px 12px 0 #1c0f06}
.logo i{position:absolute;color:#fff;font-style:normal;font-size:24px;line-height:1;text-shadow:0 0 8px #fff,0 0 16px var(--mustard)}
.logo b{position:absolute;right:-48px;bottom:6px;font-size:clamp(34px,8vw,54px);transform:rotate(12deg);line-height:1}
.logo i{animation:tw 1.8s steps(2) infinite}.logo b{animation:bob 1.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
@keyframes bob{50%{transform:rotate(12deg) translateY(-6px)}}
.logo b svg{display:block;width:clamp(44px,10vw,64px);height:auto;filter:drop-shadow(3px 3px 0 #1c0f06)}
.up{display:flex;align-items:center;gap:10px}
.up .ic{flex:none}
.up .ic svg{display:block;width:38px;height:38px;filter:drop-shadow(1px 0 0 #1c0f06) drop-shadow(-1px 0 0 #1c0f06) drop-shadow(0 1px 0 #1c0f06) drop-shadow(0 -1px 0 #1c0f06)}
.up .tx{min-width:0}
.pcwrap{display:flex;flex-direction:column;align-items:center;margin:34px auto 40px}
.pcbtn{background:none;border:0;padding:0;cursor:pointer;line-height:0}
.pcbtn canvas{width:min(336px,90vw);aspect-ratio:112/84;height:auto;image-rendering:pixelated;display:block;transition:filter .15s}
.pcbtn:hover canvas,.pcbtn:focus-visible canvas{filter:brightness(1.16) drop-shadow(0 0 10px rgba(125,255,154,.55))}
.pcbtn:focus-visible{outline:3px solid #ffd23f;outline-offset:4px}
.pccap{font:12px/1 'Courier New',monospace;letter-spacing:.16em;color:#f5e6c8;text-shadow:2px 2px 0 #1c0f06;margin-top:10px}
#opt{position:fixed;inset:0;background:rgba(10,6,2,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#opt.on{display:flex}
.win{width:min(340px,100%);background:#c9c2a4;border:4px solid #1c0f06;box-shadow:6px 6px 0 #1c0f06;font-family:'Courier New',monospace}
.win .tb{background:#1c4a2e;color:#9dffb0;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;letter-spacing:.14em}
.win .x{font:inherit;background:#c9c2a4;color:#1c0f06;border:2px solid #1c0f06;cursor:pointer;line-height:1;padding:2px 7px}
.win .bd{padding:16px;display:flex;flex-direction:column;gap:10px;background:#06200f;color:#7dff9a;border-top:4px solid #1c0f06}
.win .ot{letter-spacing:.14em;font-weight:bold;margin-bottom:4px}
.win .om{font-size:14px;line-height:1.4;color:#a8ffbc}
.opb{font:16px 'Courier New',monospace;color:#7dff9a;background:#0b3a1f;border:2px solid #7dff9a;padding:10px;cursor:pointer;text-align:left}
.opb:hover,.opb:focus-visible{background:#7dff9a;color:#06200f;outline:none}
.opb.dg{border-color:#ff6b5b;color:#ff9a8c}
.opb.dg:hover,.opb.dg:focus-visible{background:#ff6b5b;color:#2a0a05}
.stat span{text-transform:uppercase;letter-spacing:.08em;font-size:9px}
.stat b{text-shadow:2px 2px 0 rgba(28,15,6,.18)}
.up small{font-size:9px;line-height:1.5}
.up em{background:#ffd23f;color:#1c0f06;border:2px solid #1c0f06;padding:1px 5px;display:inline-block;margin-top:2px}
.up:disabled{opacity:.6}
.up .tx{font-size:10px;line-height:1.5}
main>.panel:first-child{align-self:start}
.pcalert{position:fixed;right:16px;bottom:16px;z-index:40;font:inherit;font-size:10px;color:#1c0f06;background:#ffd23f;border:4px solid #1c0f06;box-shadow:5px 5px 0 #1c0f06;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;animation:pcb .9s steps(2) infinite}
.pcalert[hidden]{display:none}
.pcalert i{font-style:normal;background:#d62828;color:#fffaf0;border:2px solid #1c0f06;width:20px;height:20px;line-height:16px;text-align:center;animation:pcb2 .9s steps(2) infinite}
@keyframes pcb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pcb2{50%{background:#fffaf0;color:#d62828}}
@keyframes pcw{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.pcbtn.ping canvas{animation:pcw 1s steps(4) infinite}
.pccap.alerting{color:#ffd23f;animation:pcb2b .9s steps(2) infinite}
@keyframes pcb2b{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.pcalert,.pcalert i,.pcbtn.ping canvas,.pccap.alerting{animation:none}}
.win .bd{max-height:70vh;overflow:auto}
.win b{color:#ffd23f}
.nb{background:#ff6b5b;color:#2a0a05;padding:0 6px;margin-left:6px}
.ar{display:flex;gap:8px;font-size:13px;line-height:1.3;padding:5px 0;border-bottom:1px dotted #1b6b34}
.ar i{font-style:normal;flex:none;color:#ffd23f}
.ar span{display:block;color:#a8ffbc;font-size:12px}
.ar.lock{opacity:.5}.ar.lock i{color:#7dff9a}
.sr{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dotted #1b6b34;padding:4px 0}
#toast{position:fixed;left:16px;bottom:16px;z-index:70;background:#fffaf0;border:4px solid #1c0f06;box-shadow:5px 5px 0 #1c0f06;padding:10px 14px;font-size:10px;line-height:1.7;color:#1c0f06;transform:translateY(160%);transition:transform .25s steps(5);max-width:70vw}
#toast.on{transform:none}
#toast b{display:block;color:#d62828;font-size:8px;letter-spacing:.1em}
.sr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:#a8ffbc}
.sc{display:flex;align-items:center;gap:6px}
.sc b{min-width:112px;text-align:center;font-size:14px;color:#7dff9a}
.sb{font:inherit;color:#7dff9a;background:#0b3a1f;border:2px solid #7dff9a;padding:4px 10px;cursor:pointer}
.sb:hover,.sb:focus-visible{background:#7dff9a;color:#06200f;outline:none}
.win input[type=range]{accent-color:#7dff9a;width:150px}
#optBody{max-height:72vh;overflow:auto}
.win{width:min(390px,100%)}
.pcalert.gold{background:linear-gradient(90deg,#ffe27a,#fff7c4,#ffd23f,#ffe27a);background-size:200% 100%;animation:gsh 1.2s linear infinite;border-color:#7a5200}@keyframes gsh{to{background-position:200% 0}}.gold,.om.gold{color:#ffe27a}.om.gold b{color:#fff3a0}.opb.gld{background:linear-gradient(90deg,#ffd23f,#fff3a0,#ffd23f);background-size:200% 100%;animation:gsh 1.4s linear infinite;color:#3a2600;font-weight:bold}.tk{margin:10px 0;text-align:center}.tk svg{width:150px;height:auto;filter:drop-shadow(0 0 6px #ffd23f)}
.pcbtn.shk{animation:shk .12s linear 7}@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,-3px)}100%{transform:translate(0,0)}}.opb.err{color:#ff7b7b;border-color:#ff7b7b;animation:ebk 1s steps(2) infinite}@keyframes ebk{50%{background:#3a0a0a}}.ot.err{color:#ff7b7b}
.cwrap{text-align:center;margin:8px 0}.clown svg{width:200px;height:auto;display:inline-block;animation:clw 2.4s steps(4) infinite}@keyframes clw{50%{transform:translateY(-4px) rotate(2deg)}}.clownmsg{text-align:center;color:#ff7b7b;font-size:15px;margin:6px 0;animation:ebk 1s steps(2) infinite}.cs{display:inline-block;padding:8px 14px;border:3px dashed #7fd6ff;color:#7fd6ff;letter-spacing:1px;font-size:11px}
.ot{text-shadow:1px 1px 0 #0b5a2a,2px 2px 0 #08431f,3px 3px 0 #052b14}.ot.err{text-shadow:1px 1px 0 #8a2a2a,2px 2px 0 #5a1414,3px 3px 0 #330a0a}.ot.gold{text-shadow:1px 1px 0 #b8860b,2px 2px 0 #7a5200,3px 3px 0 #3a2600}.clownmsg{text-shadow:1px 1px 0 #8a2a2a,2px 2px 0 #5a1414,3px 3px 0 #330a0a,4px 4px 0 #1a0505}.cs{text-shadow:1px 1px 0 #2a6a8a,2px 2px 0 #12384a,3px 3px 0 #08202b;box-shadow:3px 3px 0 #08202b}main.pgshk{animation:pgs .09s linear 6}@keyframes pgs{25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}
.logo b.golden{animation:bob 1.4s ease-in-out infinite,gpop .8s ease-out}.logo b.golden svg{filter:drop-shadow(3px 3px 0 #1c0f06) drop-shadow(0 0 8px rgba(255,210,63,.85))}@keyframes gpop{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}.tk svg{width:min(270px,92%);height:auto;filter:drop-shadow(0 0 8px rgba(255,210,63,.7))}.hud{display:flex;justify-content:space-between;font-size:11px;margin:2px 0;color:#9bffb8}.hud b{color:#ffd23f}.brow{display:flex;gap:8px;margin:6px 0}.brow .opb{flex:1;margin:0}.gsec{border:2px solid #ffd23f;padding:6px;margin:8px 0;background:rgba(255,210,63,.07)}
.logo::after{content:'';position:absolute;inset:-14px;z-index:-2;background:radial-gradient(closest-side,rgba(255,170,40,.32),rgba(255,170,40,0));pointer-events:none}.logo i,.logo b{will-change:transform,opacity}.logo b.golden svg{filter:drop-shadow(3px 3px 0 #1c0f06)}.pcalert.gold,.opb.gld{animation-timing-function:steps(8)!important}.tk svg{width:min(340px,96%)!important}
</style>
